setup_commands:
  - "pip install -r requirements.txt"

run_commands:
  - "python src/main.py demo"

test_commands:
  - "python src/tests/test_board.py"

notes: "Python 3.8+, stdlib only. `demo` is a self-contained smoke run (in-memory DB, mock agents, no API key or network). To launch the live UI: `python src/main.py serve --simulate` then open http://localhost:8000. Set ANTHROPIC_API_KEY to make agents write posts with Claude."
